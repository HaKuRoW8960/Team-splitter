name: Cloud Free-Tier Keep Alive

on:
  schedule:
    # 10分おきにクラウドサーバーの /healthz にアクセスして無料枠のスリープを防止
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloud Health Endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            curl -fsS "${APP_URL%/}/healthz" || true
          else
            echo "APP_URL repository variable is not set yet. Skipping ping."
          fi
